<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O.C. Manjos — Agent Console</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/supabase-js/2.39.0/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --panel: #14171c;
    --panel-2: #1b1f26;
    --line: #2a2f38;
    --text: #e7e9ec;
    --dim: #8a919c;
    --copper: #c9793f;
    --copper-dim: #7a4f2c;
    --live: #4caf7d;
    --wait: #d9a441;
    --stop: #c9503f;
    --font-mono: 'SF Mono', 'Consolas', 'Menlo', monospace;
    --font-sans: -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0c0e11;
    color: var(--text);
    font-family: var(--font-sans);
    min-height: 100vh;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .brand { font-size: 13px; color: var(--copper); letter-spacing: 0.04em; margin-bottom: 4px; }
  h1 { font-size: 22px; margin: 0; font-weight: 600; }
  .pulse-row { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 12px; color: var(--dim); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); }
  .dot.off { background: var(--stop); animation: none; }
  .dot { animation: blink 2s infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  .pipeline {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 32px;
  }
  .stage { background: var(--panel); padding: 18px 20px; }
  .stage .label { font-family: var(--font-mono); font-size: 11px; color: var(--copper); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
  .stage .count { font-size: 28px; font-weight: 600; line-height: 1; }
  .stage .desc { font-size: 12px; color: var(--dim); margin-top: 6px; }

  h2.section {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--dim);
    margin: 0 0 12px;
    font-weight: 600;
  }

  .feed { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin-bottom: 32px; }
  .feed-row {
    display: grid;
    grid-template-columns: 90px 1fr 130px 100px;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    align-items: center;
    font-size: 13px;
  }
  .feed-row:last-child { border-bottom: none; }
  .feed-row.head { background: var(--panel-2); color: var(--dim); font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  .feed-row:not(.head) { background: var(--panel); }
  .time { font-family: var(--font-mono); color: var(--dim); font-size: 12px; }
  .badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 3px;
    font-family: var(--font-mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    width: fit-content;
  }
  .badge.new { background: rgba(217,164,65,0.15); color: var(--wait); }
  .badge.qualified { background: rgba(76,175,125,0.15); color: var(--live); }
  .badge.restock_drafted { background: rgba(201,121,63,0.18); color: var(--copper); }

  .drafts { display: flex; flex-direction: column; gap: 10px; }
  .draft-card {
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: 6px;
    padding: 16px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .draft-card.escalated { border-left: 3px solid var(--wait); }
  .draft-card.auto_approved { border-left: 3px solid var(--live); }
  .draft-info .product { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .draft-info .meta { font-family: var(--font-mono); font-size: 12px; color: var(--dim); }
  .amount { font-family: var(--font-mono); font-size: 18px; color: var(--copper); font-weight: 600; }
  .actions { display: flex; gap: 8px; }
  button {
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 4px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s;
  }
  button.approve { border-color: var(--live); color: var(--live); }
  button.approve:hover { background: rgba(76,175,125,0.12); }
  button.reject { border-color: var(--stop); color: var(--stop); }
  button.reject:hover { background: rgba(201,80,63,0.12); }
  .status-pill {
    font-family: var(--font-mono);
    font-size: 11px;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 3px;
  }
  .status-pill.auto_approved { background: rgba(76,175,125,0.15); color: var(--live); }
  .status-pill.approved { background: rgba(76,175,125,0.15); color: var(--live); }
  .status-pill.rejected { background: rgba(201,80,63,0.15); color: var(--stop); }

  .empty { padding: 24px; text-align: center; color: var(--dim); font-size: 13px; border: 1px dashed var(--line); border-radius: 6px; }
  .config-banner {
    background: rgba(217,164,65,0.1);
    border: 1px solid var(--wait);
    color: var(--wait);
    padding: 12px 16px;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 24px;
    font-family: var(--font-mono);
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="brand">O.C. MANJOS</div>
      <h1>Agent Console</h1>
    </div>
    <div class="pulse-row"><span class="dot" id="live-dot"></span><span id="live-label">connecting</span></div>
  </header>

  <div id="config-banner" class="config-banner" style="display:none;"></div>

  <div class="pipeline">
    <div class="stage">
      <div class="label">Agent 1 — Intake</div>
      <div class="count" id="count-new">–</div>
      <div class="desc">New enquiries</div>
    </div>
    <div class="stage">
      <div class="label">Agent 2 — Qualify</div>
      <div class="count" id="count-qualified">–</div>
      <div class="desc">Stock + price checked</div>
    </div>
    <div class="stage">
      <div class="label">Agent 3 — Restock</div>
      <div class="count" id="count-drafted">–</div>
      <div class="desc">Drafts pending review</div>
    </div>
  </div>

  <h2 class="section">Restock decisions — Agent 3</h2>
  <div class="drafts" id="drafts-list">
    <div class="empty">Waiting for restock drafts…</div>
  </div>

  <h2 class="section" style="margin-top:32px;">Enquiry feed</h2>
  <div class="feed">
    <div class="feed-row head">
      <div>Time</div>
      <div>Product asked</div>
      <div>Stage</div>
      <div>Competitor?</div>
    </div>
    <div id="feed-body">
      <div class="feed-row"><div colspan="4" class="empty" style="grid-column: 1 / -1;">Waiting for enquiries…</div></div>
    </div>
  </div>

</div>

<script>
  // ---- Fill these in from your Supabase project settings (Project Settings > API) ----
  const SUPABASE_URL = 'YOUR_SUPABASE_PROJECT_URL';
  const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
  // ------------------------------------------------------------------------------------

  const configured = !SUPABASE_URL.includes('YOUR_') && !SUPABASE_ANON_KEY.includes('YOUR_');
  const banner = document.getElementById('config-banner');
  const dot = document.getElementById('live-dot');
  const liveLabel = document.getElementById('live-label');

  if (!configured) {
    banner.style.display = 'block';
    banner.textContent = 'Not connected — paste your Supabase URL and anon key into the script before this reads live data.';
    dot.classList.add('off');
    liveLabel.textContent = 'not configured';
  } else {
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    dot.classList.remove('off');
    liveLabel.textContent = 'live';

    function timeAgo(ts) {
      const diff = Math.floor((Date.now() - new Date(ts).getTime()) / 1000);
      if (diff < 60) return diff + 's ago';
      if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
      return Math.floor(diff / 3600) + 'h ago';
    }

    function fmtNaira(n) {
      return '₦' + Number(n).toLocaleString('en-NG');
    }

    async function loadEnquiries() {
      const { data, error } = await sb
        .from('enquiries')
        .select('id, created_at, product_asked, agent_stage, known_competitor')
        .order('created_at', { ascending: false })
        .limit(30);

      if (error) {
        console.error('enquiries load error', error);
        return;
      }

      const counts = { new: 0, qualified: 0, restock_drafted: 0 };
      data.forEach(row => {
        const stage = row.agent_stage || 'new';
        if (counts[stage] !== undefined) counts[stage]++;
      });
      document.getElementById('count-new').textContent = counts.new;
      document.getElementById('count-qualified').textContent = counts.qualified;
      document.getElementById('count-drafted').textContent = counts.restock_drafted;

      const feedBody = document.getElementById('feed-body');
      if (data.length === 0) {
        feedBody.innerHTML = '<div class="feed-row"><div style="grid-column: 1 / -1;" class="empty">No enquiries yet.</div></div>';
        return;
      }
      feedBody.innerHTML = data.map(row => `
        <div class="feed-row">
          <div class="time">${timeAgo(row.created_at)}</div>
          <div>${row.product_asked || '—'}</div>
          <div><span class="badge ${row.agent_stage || 'new'}">${(row.agent_stage || 'new').replace('_', ' ')}</span></div>
          <div>${row.known_competitor ? 'yes' : '—'}</div>
        </div>
      `).join('');
    }

    async function loadDrafts() {
      const { data, error } = await sb
        .from('restock_drafts')
        .select('id, product, draft_amount, status, created_at')
        .order('created_at', { ascending: false })
        .limit(20);

      if (error) {
        console.error('restock_drafts load error', error);
        return;
      }

      const list = document.getElementById('drafts-list');
      if (!data || data.length === 0) {
        list.innerHTML = '<div class="empty">No restock drafts yet.</div>';
        return;
      }

      list.innerHTML = data.map(row => {
        const escalated = row.status === 'pending';
        const cls = row.status === 'auto_approved' ? 'auto_approved' : (escalated ? 'escalated' : '');
        const actions = escalated
          ? `<div class="actions">
               <button class="approve" onclick="decide('${row.id}', 'approved')">Approve</button>
               <button class="reject" onclick="decide('${row.id}', 'rejected')">Reject</button>
             </div>`
          : `<span class="status-pill ${row.status}">${row.status.replace('_', ' ')}</span>`;

        return `
          <div class="draft-card ${cls}">
            <div class="draft-info">
              <div class="product">${row.product || 'Unnamed product'}</div>
              <div class="meta">${timeAgo(row.created_at)} · ${escalated ? 'awaiting your approval' : 'auto-processed'}</div>
            </div>
            <div class="amount">${fmtNaira(row.draft_amount || 0)}</div>
            ${actions}
          </div>
        `;
      }).join('');
    }

    window.decide = async function(id, decision) {
      const { error } = await sb.from('restock_drafts').update({ status: decision }).eq('id', id);
      if (error) {
        console.error('update error', error);
        alert('Could not save decision — check console.');
        return;
      }
      loadDrafts();
    };

    async function refresh() {
      loadEnquiries();
      loadDrafts();
    }

    refresh();
    setInterval(refresh, 5000);

    // Realtime updates for immediate feedback when rows change
    sb.channel('enquiries-changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'enquiries' }, refresh)
      .subscribe();
    sb.channel('drafts-changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'restock_drafts' }, refresh)
      .subscribe();
  }
</script>
</body>
</html>
